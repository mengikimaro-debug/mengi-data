plugins {
    id 'com.android.application'
}

android {
    namespace 'tz.mengidata.app'
    compileSdk 35

    defaultConfig {
        applicationId "tz.mengidata.app"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "2.1.0"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/mengi-data.keystore")
            storePassword System.getenv("MENGI_SIGNING_STORE_PASSWORD") ?: "mengidata2024"
            keyAlias System.getenv("MENGI_SIGNING_KEY_ALIAS") ?: "mengidata"
            keyPassword System.getenv("MENGI_SIGNING_KEY_PASSWORD") ?: "mengidata2024"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
}
