name: Release Mengidata APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Maelezo ya ziada ya toleo (hiari / optional release notes)'
        required: false
        default: ''
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign & Publish Mengidata.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate app version and release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          APP_VERSION=$(awk -F'"' '/versionName[[:space:]]*=/ {print $2; exit}' app/build.gradle.kts)
          VERSION_CODE=$(awk '/versionCode[[:space:]]*=/ {gsub(/[^0-9]/, "", $0); print $0; exit}' app/build.gradle.kts)

          if [[ -z "$APP_VERSION" || ! "$APP_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::versionName ('$APP_VERSION') in app/build.gradle.kts must match X.Y or X.Y.Z (e.g. 2.8.2)."
            exit 1
          fi

          if [[ -z "$VERSION_CODE" || "$VERSION_CODE" -le 0 ]]; then
            echo "::error::versionCode ('$VERSION_CODE') in app/build.gradle.kts must be a positive integer."
            exit 1
          fi

          if [[ "$REF_TYPE" == "tag" ]]; then
            TAG_VERSION="${REF_NAME#v}"
            TAG_VERSION="${TAG_VERSION#V}"
            if [[ "$TAG_VERSION" != "$APP_VERSION" ]]; then
              echo "::error::Git tag '$REF_NAME' (version $TAG_VERSION) does not match versionName '$APP_VERSION' in app/build.gradle.kts. AppUpdateManager requires an exact match."
              exit 1
            fi
            RELEASE_TAG="$REF_NAME"
          else
            RELEASE_TAG="v${APP_VERSION}"
          fi

          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Verified Mengidata v${APP_VERSION} (versionCode ${VERSION_CODE}) -> tag ${RELEASE_TAG}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Android SDK and build-tools
        run: |
          set -euo pipefail

          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$ANDROID_SDK" || ! -d "$ANDROID_SDK" ]]; then
            echo "::error::Android SDK not found on runner."
            exit 1
          fi

          SDKMANAGER=""
          if [[ -x "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [[ -n "$SDKMANAGER" ]]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

          find_build_tools() {
            if [[ -d "$ANDROID_SDK/build-tools" ]]; then
              for dir in $(ls -1d "$ANDROID_SDK"/build-tools/* 2>/dev/null | sort -V -r); do
                if [[ -x "$dir/zipalign" && -x "$dir/apksigner" ]]; then
                  echo "$dir"
                  return 0
                fi
              done
            fi
            return 1
          }

          BUILD_TOOLS_DIR="$(find_build_tools || true)"
          if [[ -z "$BUILD_TOOLS_DIR" ]]; then
            if [[ -z "$SDKMANAGER" ]]; then
              echo "::error::Neither build-tools nor sdkmanager found."
              exit 1
            fi
            "$SDKMANAGER" "build-tools;36.0.0"
            BUILD_TOOLS_DIR="$(find_build_tools)"
          fi

          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"
          echo "Using Android build-tools: $BUILD_TOOLS_DIR"

      - name: Restore or initialize persistent signing keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_SOURCE=""

          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > debug.keystore
            chmod 600 debug.keystore
            KEYSTORE_SOURCE="GitHub Secret (DEBUG_KEYSTORE_BASE64)"
            echo "Restored debug.keystore from GitHub secret DEBUG_KEYSTORE_BASE64"
          elif [[ -f "debug.keystore.base64" ]]; then
            tr -d '\n\r ' < debug.keystore.base64 | base64 --decode > debug.keystore
            chmod 600 debug.keystore
            KEYSTORE_SOURCE="Repository debug.keystore.base64"
            echo "Restored debug.keystore from repository debug.keystore.base64"
          elif [[ -f "debug.keystore" && -s "debug.keystore" ]]; then
            KEYSTORE_SOURCE="Workspace debug.keystore"
            echo "Using existing workspace debug.keystore"
          else
            # Zero-setup persistent CI keystore vault stored in a private GitHub Draft Release.
            # Draft releases are private to the repository, never expire, never affect /releases/latest,
            # and keep the exact same SHA-256 signing certificate across every future GitHub release.
            VAULT_TAG="mengidata-ci-keystore"
            ASSET_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.draft == true and .tag_name == \"${VAULT_TAG}\") | .assets[] | select(.name == \"debug.keystore\") | .id" 2>/dev/null | head -n 1 || true)

            if [[ -n "$ASSET_ID" ]]; then
              gh api -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > debug.keystore || true
            fi

            if [[ -s "debug.keystore" ]]; then
              chmod 600 debug.keystore
              KEYSTORE_SOURCE="Persistent GitHub CI Keystore Vault"
              echo "Restored persistent debug.keystore from private draft release ${VAULT_TAG}"
            else
              rm -f debug.keystore
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Mengidata,OU=Mobile,O=Mengidata,C=TZ"
              chmod 600 debug.keystore

              gh release create "$VAULT_TAG" \
                debug.keystore \
                --draft \
                --title "Mengidata CI Keystore (Private Draft - Do Not Publish)" \
                --notes "Automatically managed persistent keystore so every GitHub Mengidata.apk release keeps the exact same SHA-256 signing certificate." || true

              KEYSTORE_SOURCE="Persistent GitHub CI Keystore Vault (Initialized)"
              echo "Created and persisted debug.keystore in private draft release ${VAULT_TAG}"
            fi
          fi

          echo "KEYSTORE_SOURCE=$KEYSTORE_SOURCE" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build, align, sign, and verify Mengidata.apk
        id: sign
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cleanup() {
            rm -f "${RUNNER_TEMP}/release.keystore" "build-aligned.apk" "debug.keystore"
          }
          trap cleanup EXIT

          if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_KEYSTORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" ]]; then
            # Production Release Track: assembleRelease + zipalign + production release keystore
            gradle :app:assembleRelease --stacktrace

            RAW_APK=""
            if [[ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]]; then
              RAW_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            elif [[ -f "app/build/outputs/apk/release/app-release.apk" ]]; then
              RAW_APK="app/build/outputs/apk/release/app-release.apk"
            else
              echo "::error::Release APK output not found in app/build/outputs/apk/release/."
              exit 1
            fi

            "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$RAW_APK" build-aligned.apk

            echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            chmod 600 "${RUNNER_TEMP}/release.keystore"

            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks "${RUNNER_TEMP}/release.keystore" \
              --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
              --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --key-pass env:RELEASE_KEY_PASSWORD \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out Mengidata.apk \
              build-aligned.apk

            SIGNING_MODE="Production Release Keystore (GitHub Secrets)"
          else
            # Consistent Persistent Keystore Track (Android 13+ In-Place Update Compatible):
            # Uses :app:assembleDebug with our persistent debug.keystore so both certificate SHA-256
            # and debuggable flags remain consistent across releases.
            gradle :app:assembleDebug --stacktrace

            if [[ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]]; then
              echo "::error::Debug APK output not found in app/build/outputs/apk/debug/app-debug.apk."
              exit 1
            fi

            cp "app/build/outputs/apk/debug/app-debug.apk" Mengidata.apk
            SIGNING_MODE="${KEYSTORE_SOURCE:-Persistent Project Keystore}"
            echo "::notice::Built Mengidata.apk using ${SIGNING_MODE}"
          fi

          VERIFY_OUTPUT=$("$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs Mengidata.apk 2>&1)
          echo "$VERIFY_OUTPUT"

          CERT_SHA256=$(printf '%s\n' "$VERIFY_OUTPUT" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' || true)
          APK_BYTES=$(stat -c%s Mengidata.apk)
          MAX_BYTES=$((100 * 1024 * 1024))
          if [[ "$APK_BYTES" -le 0 || "$APK_BYTES" -gt "$MAX_BYTES" ]]; then
            echo "::error::Mengidata.apk size ($APK_BYTES bytes) exceeds AppUpdateManager 100 MB limit."
            exit 1
          fi

          sha256sum Mengidata.apk > Mengidata.apk.sha256
          APK_SHA256=$(awk '{print $1}' Mengidata.apk.sha256)
          APK_MB=$(awk -v b="$APK_BYTES" 'BEGIN { printf "%.2f MB", b / 1048576 }')

          echo "signing_mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_MB" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        env:
          CUSTOM_NOTES: ${{ github.event.inputs.release_notes }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_SIZE: ${{ steps.sign.outputs.apk_size }}
          APK_SHA256: ${{ steps.sign.outputs.apk_sha256 }}
          CERT_SHA256: ${{ steps.sign.outputs.cert_sha256 }}
          SIGNING_MODE: ${{ steps.sign.outputs.signing_mode }}
        run: |
          set -euo pipefail
          BODY_FILE="${RUNNER_TEMP}/release-body.md"
          {
            echo "## Mengidata v${APP_VERSION}"
            echo ""
            if [[ -n "$CUSTOM_NOTES" ]]; then
              printf '%s\n\n' "$CUSTOM_NOTES"
            fi
            echo "### Taarifa za APK / Build Details"
            echo "- **Toleo (versionName):** \`${APP_VERSION}\`"
            echo "- **Build (versionCode):** \`${VERSION_CODE}\`"
            echo "- **Ukubwa (Size):** \`${APK_SIZE}\`"
            echo "- **Saini (Signing):** ${SIGNING_MODE}"
            echo "- **APK SHA-256:** \`${APK_SHA256}\`"
            if [[ -n "$CERT_SHA256" ]]; then
              echo "- **Cheti SHA-256:** \`${CERT_SHA256}\`"
            fi
          } > "$BODY_FILE"

      - name: Publish GitHub Release (Immutable Release Compatible)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BODY_FILE="${RUNNER_TEMP}/release-body.md"
          FINAL_TAG="$RELEASE_TAG"

          # Clean up any leftover unpublished draft for this exact tag
          EXISTING_DRAFT_IDS=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" \
            --jq ".[] | select(.draft == true and .tag_name == \"${FINAL_TAG}\") | .id" 2>/dev/null || true)
          for DID in $EXISTING_DRAFT_IDS; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${DID}" >/dev/null 2>&1 || true
          done

          # If a published release already exists for this tag, try uploading with --clobber first
          if gh release view "$FINAL_TAG" >/dev/null 2>&1; then
            if gh release upload "$FINAL_TAG" Mengidata.apk Mengidata.apk.sha256 --clobber >/dev/null 2>&1; then
              echo "Updated existing release $FINAL_TAG with Mengidata.apk and Mengidata.apk.sha256"
              exit 0
            else
              echo "::warning::Release $FINAL_TAG is locked by GitHub Release Immutability; removing and recreating draft-first."
              gh release delete "$FINAL_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
            fi
          fi

          # Create as DRAFT first with all assets attached so GitHub Release Immutability never rejects asset uploads,
          # then atomically publish the draft via REST API.
          gh release create "$FINAL_TAG" \
            Mengidata.apk \
            Mengidata.apk.sha256 \
            --target "$TARGET_SHA" \
            --title "Mengidata ${FINAL_TAG}" \
            --notes-file "$BODY_FILE" \
            --generate-notes \
            --draft

          DRAFT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            --jq ".[] | select(.draft == true and .tag_name == \"${FINAL_TAG}\") | .id" | head -n 1)

          if [[ -n "$DRAFT_ID" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}" \
              -F draft=false \
              -f make_latest=true >/dev/null
            echo "Published Mengidata ${FINAL_TAG} (release id ${DRAFT_ID}) successfully!"
          else
            gh release edit "$FINAL_TAG" --draft=false --latest
          fi
